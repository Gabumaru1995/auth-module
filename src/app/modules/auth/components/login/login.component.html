<div class="login-container">
  <div class="login-card">
    <h2 class="title">Iniciar Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <!-- Campo de correo -->
      <div class="p-field">
        <label for="email">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          pInputText
          placeholder="Ingresa tu correo"
          formControlName="email"
          [class.ng-invalid]="isFieldInvalid('email')"
        />
        <small *ngIf="isFieldInvalid('email')" class="p-error">
          Ingresa un correo válido.
        </small>
      </div>

      <!-- Campo de contraseña -->
      <div class="p-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          pInputText
          placeholder="Ingresa tu contraseña"
          formControlName="password"
          [class.ng-invalid]="isFieldInvalid('password')"
        />
        <small *ngIf="isFieldInvalid('password')" class="p-error">
          La contraseña es requerida.
        </small>
      </div>

      <!-- Botones -->
      <div class="button-group">
        <button pButton type="submit" label="Iniciar Sesión" [disabled]="loginForm.invalid"></button>
        <button pButton type="button" label="Recuperar Contraseña" class="p-button-text" (click)="onForgotPassword()"></button>
      </div>
    </form>
  </div>
</div>
