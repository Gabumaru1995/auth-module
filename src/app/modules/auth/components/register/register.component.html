<div class="register-container">
  <div class="register-card">
    <h2 class="title">Registrarse</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <!-- Campo de nombre de usuario -->
      <div class="p-field">
        <label for="username">Nombre de Usuario</label>
        <input
          id="username"
          type="text"
          pInputText
          placeholder="Ingresa tu nombre de usuario"
          formControlName="username"
          [class.ng-invalid]="isFieldInvalid('username')"
        />
        @if (isFieldInvalid('username')) {
          <small class="p-error">El nombre de usuario es requerido.</small>
        }
      </div>

      <!-- Campo de correo electrónico -->
      <div class="p-field">
        <label for="email">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          pInputText
          placeholder="Ingresa tu correo"
          formControlName="email"
          [class.ng-invalid]="isFieldInvalid('email')"
        />
        @if (isFieldInvalid('email')) {
          <small class="p-error">Ingresa un correo válido.</small>
        }
      </div>

      <!-- Campo de contraseña -->
      <div class="p-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          pInputText
          placeholder="Ingresa tu contraseña"
          formControlName="password"
          [class.ng-invalid]="isFieldInvalid('password')"
        />
        @if (isFieldInvalid('password')) {
          <small class="p-error">La contraseña es requerida (mínimo 6 caracteres).</small>
        }
      </div>

      <!-- Botón de registro -->
      <div class="button-group">
        <button pButton type="submit" label="Registrarse" [disabled]="registerForm.invalid"></button>
      </div>
    </form>
  </div>
</div>
